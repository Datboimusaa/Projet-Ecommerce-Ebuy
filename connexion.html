<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

<div class="min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Connexion</h2>
        
        <form id="connexionForm" action="#" class="space-y-6">
         <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
         <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
         <path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/> </svg>
        </span>
         <input id="email" type="email" placeholder="nom@exemple.com" class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-700 outline-none transition-all">
        </div>
          </div>

            <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <div class="relative">
         <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/> </svg>
        </span>
        <input id="password" type="password" placeholder="••••••••" class="pl-10 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-gray-700 outline-none transition-all">
        </div>
         </div>

        <button type="submit" class="w-full bg-primary hover:bg-gray-400 text-white font-bold py-3 rounded-lg shadow-lg transform transition hover:scale-[1.02] active:scale-95 cursor-pointer">Se connecter </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600"> Pas de compte ? <a href="inscription.html" class="text-black-600 font-bold hover:underline">S'inscrire</a> </p>
    </div>
 </div>

 <script src="connexion.js"></script>

</body>
</html>
