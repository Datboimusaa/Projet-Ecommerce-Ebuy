<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-white h-screen p-4 ">

  <div class="items-center justify-center flex h-full">
    
    <div class=""></div>

    <!-- Formulaire d'inscription -->
    <div class="relative bg-white/90 backdrop-blur-md p-6 rounded-2xl shadow-xl w-full max-w-xl mx-4">
         <div class="text-center mb-4">
         <h2 class="text-2xl font-black text-gray-800 uppercase tracking-tighter">Créer mon profil</h2>
        </div>
        <form  id="inscriptionForm" action="#" class="grid grid-cols-2 gap-3">
            
    <!-- Photo de profil -->
            

             <input id="fullname" type="text" placeholder="Nom complet" class="text-sm p-2.5 border border-gray-300 rounded-lg ">
              <input id="email" type="email" placeholder="Email" class="text-sm p-2.5 border border-gray-300 rounded-lg ">
            
             <input id="birthdate" type="date" class="text-sm p-2.5 border border-gray-300 rounded-lg text-gray-400">
             <select id="gender" class="text-sm p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-300 bg-white">
  <option value="">Choisir un genre</option>
  <option value="Homme">Homme</option>
  <option value="Femme">Femme</option>
</select>


            <input id="password" type="password" placeholder="Mot de passe" class="text-sm p-2.5 border border-primary-300 rounded-lg ">
            <input id="confirmPassword" type="password" placeholder="Confirmation" class="text-sm p-2.5 border border-primary-300 rounded-lg ">

           
<div class="col-span-2 py-2">
     <p class="text-[10px] uppercase font-bold text-black mb-2 text-center">Vous êtes plutôt ?</p>
      <div class="grid grid-cols-3 gap-2">
       
        <!-- Client -->
<label class="cursor-pointer group">
    <input type="radio" name="role" value="Client" class="peer hidden" checked> 
    <div class="text-center p-2 rounded-lg border border-gray-200 bg-white peer-checked:border-gray-600 peer-checked:bg-indigo-50 transition-all">
        <span class="text-[10px] font-bold text-gray-600 uppercase">Client</span>
    </div>
</label>

<!-- Vendeur -->
<label class="cursor-pointer group">
    <input type="radio" name="role" value="Vendeur" class="peer hidden"> <!-- AJOUT DE value="Vendeur" -->
    <div class="text-center p-2 rounded-lg border border-gray-200 bg-white peer-checked:border-gray-600 peer-checked:bg-indigo-50 transition-all">
        <span class="text-[10px] font-bold text-gray-600 uppercase">Vendeur</span>
    </div>
</label>

<!-- Livreur -->
<label class="cursor-pointer group">
    <input type="radio" name="role" value="Livreur" class="peer hidden"> <!-- AJOUT DE value="Livreur" -->
    <div class="text-center p-2 rounded-lg border border-gray-200 bg-white peer-checked:border-gray-600 peer-checked:bg-indigo-50 transition-all">
        <span class="text-[10px] font-bold text-gray-600 uppercase">Livreur</span>
    </div>
</label>

        </div>
        </div>
            <button type="submit" class="col-span-2 bg-primary hover:bg-gray-400 text-white font-bold py-3 rounded-lg shadow-md transform transition hover:scale-[1.02] active:scale-95 cursor-pointer">S'INSCRIRE</button>
         </form>

        <p class="mt-4 text-center text-[11px] text-gray-500 italic">Déjà membre ? <a href="connexion.html" class="text-gray-600 font-bold not-italic hover:underline">Se connecter</a> </p>
       </div>
    </div>


 <script src="inscription.js"></script>
</body>
</html>
