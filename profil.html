<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <!-- Carte profil -->
  <div class="w-[500px] bg-white rounded-3xl shadow-2xl overflow-hidden">

    
    <div class="relative">
      <!-- Image de couverture -->
      <img id="coverImage"
        src="assets/images/téléchargement (40).jpg"
        class="w-full h-60 object-cover">

      <!-- Bouton  -->
      <label for="uploadCover"
        class="absolute top-3 right-3 bg-white w-3 h-3 rounded-full flex items-center justify-center shadow cursor-pointer hover:bg-gray-200 text-lg">
        +
      </label>
      <input type="file" id="uploadCover" class="hidden" accept="image/*">
         <!-- contain  -->
      <div class="absolute -bottom-14 left-1/2 transform -translate-x-1/2">
        <div class="relative w-40 h-40">
          <!-- Image profil -->
          <img id="profileImage"
            src="assets/images/téléchargement (41).jpg"
            class="w-40 h-40 rounded-full border-2 border-white object-cover">

          <!-- Bouton upload profil -->
          <label for="uploadProfile"
            class="absolute bottom-2 right-2 bg-gray-200 text-black w-6 h-6 rounded-full flex items-center justify-center cursor-pointer shadow hover:bg-gray-300">
            +
          </label>
          <input type="file" id="uploadProfile" class="hidden" accept="image/*">
        </div>
      </div>
    </div>

   
  <div class="pt-16 pb-6 px-8">
  <h2 id="profilName" class="text-center text-xl font-bold italic">Nom utilisateur</h2>
  <p id="profilEmail" class="text-center text-sm text-gray-600 mt-2">Email utilisateur</p>
  <p id="profilRole" class="text-center text-sm text-gray-600">Rôle utilisateur</p>
  <p id="profilBirthdate" class="text-center text-sm text-gray-600">Date de naissance</p>
  <p id="profilGender" class="text-center text-sm text-gray-600">Genre</p>

  <!-- Menu -->
  <div class="mt-6 space-y-3">
    <div id="btnCommandes" class="flex justify-between items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 cursor-pointer">
      <span>Mes commandes</span>
      <span>></span>
    </div>
   
    <div id="btnPreferences" class="flex justify-between items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 cursor-pointer">
      <span>Mes préférences</span>
      <span>></span>
    </div>
  </div>

  
<div id="preferencesSection" class="mt-6 hidden">
    <h3 class="text-lg font-bold">Mes préférences</h3>
    <p class="text-gray-600">Paramètres et préférences utilisateur...</p>
  </div>


  <!-- Command dina -->
  <div id="commandesSection" class="mt-6 hidden">
    <h3 class="text-lg font-bold">Mes commandes</h3>
    <p class="text-gray-600">Liste de mes commandes passées...</p>
  </div>


<!-- décon -->
      <button id="logoutBtn" class="mt-6 w-full bg-orange-400 text-white py-2 rounded-lg shadow hover:bg-amber-600 transition">
        Déconnexion
      </button>
    </div>
  </div>





  

    <script src="profil.js"></script>
</body>
</html>
